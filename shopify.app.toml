# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9620563a9ea6bc8e3f91ec87e893f4e8"
name = "Fly To Cart Pro"
application_url = "https://fly-to-cart-pro.fly.dev"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,write_metaobjects,read_metaobjects"

[auth]
redirect_urls = [ "https://fly-to-cart-pro.fly.dev/auth/callback" ]

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[product.metafields.app.ftc_cart_config]
type = "json"
name = "Fly-to-Cart Config"
description = "Animation and sound configuration for add-to-cart action"

  [product.metafields.app.ftc_cart_config.access]
  admin = "merchant_read_write"

[shop.metafields.app.ftc_global_settings]
type = "json"
name = "Fly-to-Cart Global Settings"
description = "Global configuration for Fly-to-Cart Pro app"

  [shop.metafields.app.ftc_global_settings.access]
  admin = "merchant_read_write"

[metaobjects.app.ftc_animation_preset]
name = "FTC Animation Preset"
description = "Predefined animation configuration for add-to-cart actions"

  [metaobjects.app.ftc_animation_preset.access]
  admin = "merchant_read_write"

[metaobjects.app.ftc_animation_preset.fields.animation_name]
name = "Animation Name"
type = "single_line_text_field"
required = true

[metaobjects.app.ftc_animation_preset.fields.animation_key]
name = "Animation Key"
type = "single_line_text_field"
required = true

[metaobjects.app.ftc_animation_preset.fields.duration_ms]
name = "Duration (milliseconds)"
type = "number_integer"

[metaobjects.app.ftc_animation_preset.fields.preview_json]
name = "GSAP Timeline Config"
type = "multi_line_text_field"

[metaobjects.app.ftc_animation_preset.fields.enabled]
name = "Enabled"
type = "boolean"

[metaobjects.app.ftc_sound_preset]
name = "FTC Sound Preset"
description = "Predefined sound configuration for add-to-cart actions"

  [metaobjects.app.ftc_sound_preset.access]
  admin = "merchant_read_write"

[metaobjects.app.ftc_sound_preset.fields.sound_name]
name = "Sound Name"
type = "single_line_text_field"
required = true

[metaobjects.app.ftc_sound_preset.fields.sound_key]
name = "Sound Key"
type = "single_line_text_field"
required = true

[metaobjects.app.ftc_sound_preset.fields.file_url]
name = "Sound File URL"
type = "url"

[metaobjects.app.ftc_sound_preset.fields.duration_ms]
name = "Duration (milliseconds)"
type = "number_integer"

[metaobjects.app.ftc_sound_preset.fields.volume]
name = "Volume"
type = "number_decimal"

[metaobjects.app.ftc_sound_preset.fields.enabled]
name = "Enabled"
type = "boolean"

[build]
automatically_update_urls_on_dev = true
